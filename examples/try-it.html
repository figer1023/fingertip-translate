<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>试试指尖译</title><style>body{font:18px/1.65 system-ui,sans-serif;max-width:39rem;margin:8vh auto;padding:0 1.5rem;color:#27241f;background:#fffaf2}h1{font-size:2rem}section{border-top:1px solid #d3c5b2;padding:1rem 0}strong{font-size:1.35rem}p{margin:.45rem 0}</style><main><h1>试试指尖译 🍊</h1><p>先启动指尖译，然后在这页试三次。</p><section><strong lang="en">apple</strong><p>把鼠标停在字母上约半秒，看看释义里有没有「苹果」。</p></section><section><strong>🍊</strong><p>把鼠标停在表情上，浮窗会显示「橘子」。</p></section><section><strong lang="en">I like oranges.</strong><p>拖动选中上面这句话，松开鼠标查看整句译文。第一次使用可以在指尖译菜单里准备英译中语言包。</p></section></main></html>
